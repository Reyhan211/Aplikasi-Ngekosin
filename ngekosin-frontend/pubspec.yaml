name: ngekosin
description: "Ngekos.in - aplikasi cari & sewa kos (UTS Pemrograman Aplikasi Bergerak)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1          # routing + bottom nav (StatefulShellRoute)
  google_fonts: ^6.2.1        # Bricolage Grotesque + Figtree
  http: ^1.2.0                # panggil REST API
  intl: ^0.19.0
  shared_preferences: ^2.2.2  # simpan token login
  image_picker: ^1.0.7        # upload foto kos / bukti bayar / chat
  flutter_map: ^8.2.2         # peta OpenStreetMap (tanpa API key)
  latlong2: ^0.9.1            # tipe koordinat untuk flutter_map
  url_launcher: ^6.3.0        # buka Google Maps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cities/
    - assets/kos/
    - assets/campus/
    - assets/brand/
